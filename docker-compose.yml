services:
  postgres:
    image: postgres:15-alpine
    container_name: codemaster-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: codemaster
    ports:
      - "5433:5432"
    volumes:
      - codemaster_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  codemaster_pg_data:
